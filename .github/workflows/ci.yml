name: CI Verification Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PACKS_PUBLISH_TOKEN availability
        id: assets_token
        env:
          PACKS_PUBLISH_TOKEN: ${{ secrets.PACKS_PUBLISH_TOKEN }}
        run: |
          if [ -n "$PACKS_PUBLISH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "PACKS_PUBLISH_TOKEN not set (e.g. fork PR); running offline suites only."
          fi

      - name: Checkout HclX/RePal_Assets (when PACKS_PUBLISH_TOKEN is available)
        if: steps.assets_token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: HclX/RePal_Assets
          ref: main
          token: ${{ secrets.PACKS_PUBLISH_TOKEN }}
          path: _repal_assets
          fetch-depth: 1

      - name: Mount assets into site/assets
        if: steps.assets_token.outputs.available == 'true'
        run: |
          rm -rf site/assets
          ln -s "$PWD/_repal_assets/assets" site/assets
          test -f site/assets/data/scenes.yaml

      - name: Install Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Run Rust workspace unit & pal-headless visual E2E tests
        run: |
          cargo check --workspace --tests
          if [ -f site/assets/data/scenes.yaml ]; then
            cargo test --workspace
          else
            cargo test --lib --workspace
            cargo test -p pal-desktop
          fi

      - name: Build pal-wasm for wasm32-unknown-unknown
        run: |
          cargo build -p pal-wasm --target wasm32-unknown-unknown --release
          mkdir -p site/wasm
          cp target/wasm32-unknown-unknown/release/pal_wasm.wasm site/wasm/pal.wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run offline JS & Python hygiene suites
        run: |
          node tools/tests/test_pack_manager.mjs
          python3 -m pytest tools/tests/test_repo_hygiene.py -v

      - name: Run asset-dependent browser-host & Python suites (when assets are available)
        run: |
          if [ ! -f site/assets/data/scenes.yaml ]; then
            echo "Assets not present; skipping asset-dependent JS/Python suites."
            exit 0
          fi
          node tools/tests/test_host.mjs
          node tools/tests/test_headless_harness.mjs
          node tools/test_rust_core_host.mjs
          python3 tools/audit_script_parity.py
          # Asset-package completeness gate (#18): every asset reachable from a chapter must be
          # in `base` or that chapter's package.
          python3 tools/build_asset_packs.py check --assets site/assets
          python3 -m pytest tools/tests/ -v
