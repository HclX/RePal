name: Nightly Fuzz & Coverage Suite

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      ticks:
        description: "Ticks per save (PAL_FUZZ_TICKS)"
        required: false
        default: "3000"
      seeds:
        description: "Seeds per save (PAL_FUZZ_SEEDS)"
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  nightly-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PACKS_PUBLISH_TOKEN secret
        env:
          PACKS_PUBLISH_TOKEN: ${{ secrets.PACKS_PUBLISH_TOKEN }}
        run: |
          if [ -z "$PACKS_PUBLISH_TOKEN" ]; then
            echo "::error::PACKS_PUBLISH_TOKEN not set; cannot checkout HclX/RePal_Assets for 51-save fuzz suite."
            exit 1
          fi

      - name: Checkout HclX/RePal_Assets
        uses: actions/checkout@v4
        with:
          repository: HclX/RePal_Assets
          ref: main
          token: ${{ secrets.PACKS_PUBLISH_TOKEN }}
          path: _repal_assets
          fetch-depth: 1

      - name: Mount assets into site/assets
        run: |
          rm -rf site/assets
          ln -s "$PWD/_repal_assets/assets" site/assets
          test -f site/assets/data/scenes.yaml
          test "$(ls site/assets/orig_saves/*.rpg | wc -l)" -eq 51

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Run extended 51-save + New Game invariant, replay, text-mode & parser fuzzing
        env:
          PAL_FUZZ_TICKS: ${{ github.event.inputs.ticks || '3000' }}
          PAL_FUZZ_SEEDS: ${{ github.event.inputs.seeds || '4' }}
          PAL_CONT_WARMUP: "400"
          PAL_CONT_FOLLOW: "600"
          PAL_PARSER_FUZZ_ITERS: "3000"
          # Story-checkpoint corpus (test_data/fuzz_corpus, built by tools/build_fuzz_corpus.py).
          PAL_FUZZ_CORPUS: "1"
        run: |
          cargo test -p pal-core --test fuzz_invariants --test fuzz_parsers --release -- --nocapture
          cargo test -p pal-runtime --features disk --test fuzz_runtime --release -- --nocapture
          cargo test -p pal-headless --test fuzz_text_mode --release -- --nocapture

      - name: Upload minimized failure replays & parser crash inputs (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-artifacts
          path: |
            .tmp/fuzz_failure_*.json
            .tmp/fuzz_parser_*.bin
          if-no-files-found: ignore
          retention-days: 3

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout HclX/RePal_Assets
        uses: actions/checkout@v4
        with:
          repository: HclX/RePal_Assets
          ref: main
          token: ${{ secrets.PACKS_PUBLISH_TOKEN }}
          path: _repal_assets
          fetch-depth: 1

      - name: Mount assets into site/assets
        run: |
          rm -rf site/assets
          ln -s "$PWD/_repal_assets/assets" site/assets
          test -f site/assets/data/scenes.yaml

      - name: Install Rust toolchain (with llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Line coverage of the workspace test suite
        run: |
          cargo llvm-cov --workspace --html --output-dir coverage
          cargo llvm-cov report --summary-only | tee coverage/summary.txt
          {
            echo '### Rust line coverage (workspace tests)'
            echo '```'
            tail -n 1 coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage
          retention-days: 14
